# Qwen2.5-7B QLoRA (24GB) — E3 supplementary replication, Phase 6 era
# Same corpus/target/protocol family as E1 (3B), LoRA rank per original 7B plan.
model_family: qwen2.5-7b-instruct
quantization: 4bit
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
epochs: 2
batch_size: 2
grad_accum: 8
lr: 5.0e-5
scheduler: cosine
warmup_ratio: 0.03
max_seq_length: 1024
logging_steps: 20
eval_steps: 500
save_steps: 1000
bf16: true
gradient_checkpointing: true
