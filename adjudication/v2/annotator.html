      const CSV_HEADER = ["item_id","task_id","step","consumer","class","value","n_candidates","judgment","notes"];

      let who = 'A';
      let idx = 0;
      const store = { A: {}, B: {} };   // item_id -> {judgment, notes}

      function loadState() {
        try {
          const ws = window.zcode && window.zcode.widgetState;
          if (ws && ws.adj) {
            if (ws.adj.store) { store.A = ws.adj.store.A || {}; store.B = ws.adj.store.B || {}; }
            if (ws.adj.who) who = ws.adj.who;
            if (typeof ws.adj.idx === 'number') idx = Math.min(ws.adj.idx, ITEMS.length - 1);
            return;
          }
        } catch (e) {}
        try {
          const raw = localStorage.getItem('adj_v2');
          if (raw) { const s = JSON.parse(raw); store.A = s.A || {}; store.B = s.B || {}; }
        } catch (e) {}
      }
      function saveState() {
        try {
          window.zcode && window.zcode.setWidgetState &&
            window.zcode.setWidgetState({ privateContent: { adj: { who, idx, store } } }).catch(() => {});
        } catch (e) {}
        try {
          localStorage.setItem('adj_v2', JSON.stringify({ A: store.A, B: store.B }));
        } catch (e) {}
      }

      const $ = (id) => document.getElementById(id);

      function esc(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }

      function render() {
        const it = ITEMS[idx];
        const cur = store[who][it.item_id] || {};
        $('adj-who').value = who;
        $('adj-item-id').textContent = it.item_id + ' · ' + (idx + 1) + '/' + ITEMS.length;
        $('adj-item-meta').textContent = '任务 ' + it.task_id + ' · 步骤 ' + it.step + ' · 解锁该任务';
        $('adj-consumer').textContent = it.consumer;
        $('adj-value').textContent = it.value;
        const cls = $('adj-class');
        cls.textContent = it.class === 'LOW_ENTROPY_MATCH' ? '低熵值' : '多来源';
        $('adj-ncand').textContent = it.candidates.length;
        const box = $('adj-cands');
        box.innerHTML = '';
        it.candidates.forEach((c, i) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'adj-cand' + (cur.judgment === 'ACCEPT_' + (i + 1) ? ' is-selected' : '');
          b.setAttribute('aria-pressed', cur.judgment === 'ACCEPT_' + (i + 1) ? 'true' : 'false');
          b.innerHTML = '<b>候选 ' + (i + 1) + '</b><span class="adj-kbd">' + (i + 1) + '</span><br>' +
            '<span class="adj-path">' + esc(c.producer_tool) + '.' + esc(c.path) + '</span>' +
            ' <span class="text-small">· 实体 ' + esc(c.entity) + ' · 第 ' + (c.producer_step + 1) + ' 步输出</span>';
          b.addEventListener('click', () => { judge('ACCEPT_' + (i + 1)); });
          box.appendChild(b);
        });
        $('adj-none').setAttribute('aria-pressed', cur.judgment === 'NONE' ? 'true' : 'false');
        $('adj-unsure').setAttribute('aria-pressed', cur.judgment === 'UNSURE' ? 'true' : 'false');
        $('adj-notes').value = cur.notes || '';
        $('adj-input').textContent = it.compile_input;
        const done = ITEMS.filter(t => (store[who][t.item_id] || {}).judgment).length;
        const pct = Math.round(100 * done / ITEMS.length);
        $('adj-progress').setAttribute('aria-valuenow', pct);
        $('adj-progress').querySelector('.progress-bar').style.width = pct + '%';
        $('adj-progress-label').textContent = '已裁决 ' + done + '/' + ITEMS.length + ' (' + pct + '%)';
      }

      function judge(j) {
        const it = ITEMS[idx];
        store[who][it.item_id] = {
          judgment: j,
          notes: $('adj-notes').value.trim()
        };
        saveState(); render();
        if (j && idx < ITEMS.length - 1) { idx++; saveState(); render(); }
      }

      $('adj-who').addEventListener('change', (e) => { who = e.target.value; saveState(); render(); });
      $('adj-none').addEventListener('click', () => judge('NONE'));
      $('adj-unsure').addEventListener('click', () => judge('UNSURE'));
      $('adj-notes').addEventListener('change', () => {
        const it = ITEMS[idx];
        const cur = store[who][it.item_id] || {};
        if (cur.judgment) { cur.notes = $('adj-notes').value.trim(); store[who][it.item_id] = cur; saveState(); }
      });
      $('adj-prev').addEventListener('click', () => { if (idx > 0) { idx--; saveState(); render(); } });
      $('adj-next').addEventListener('click', () => { if (idx < ITEMS.length - 1) { idx++; saveState(); render(); } });
      $('adj-jump-unjudged').addEventListener('click', () => {
        for (let k = 1; k <= ITEMS.length; k++) {
          const j = (idx + k) % ITEMS.length;
          if (!(store[who][ITEMS[j].item_id] || {}).judgment) { idx = j; saveState(); render(); return; }
        }
      });

      function buildCsv() {
        const lines = [CSV_HEADER.join(',')];
        ITEMS.forEach(it => {
          const cur = store[who][it.item_id] || {};
          const q = (s) => '"' + String(s || '').replace(/"/g, '""') + '"';
          lines.push([it.item_id, it.task_id, it.step, it.consumer, it.class,
                      it.value, it.candidates.length,
                      q(cur.judgment || ''), q(cur.notes || '')].join(','));
        });
        return lines.join('\n');
      }
      $('adj-export').addEventListener('click', () => {
        const csv = buildCsv();
        try {
          const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'annotator_' + who + '.csv';
          document.body.appendChild(a); a.click(); a.remove();
        } catch (e) {}
        const out = $('adj-csv-out');
        out.hidden = false; out.value = csv;
      });
      $('adj-copy').addEventListener('click', async () => {
        const out = $('adj-csv-out');
        out.hidden = false; out.value = buildCsv();
        out.select();
        try { await navigator.clipboard.writeText(out.value); } catch (e) { document.execCommand('copy'); }
      });

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        const it = ITEMS[idx];
        if (e.key >= '1' && e.key <= '9') {
          const n = parseInt(e.key, 10);
          if (n <= it.candidates.length) judge('ACCEPT_' + n);
        } else if (e.key === 'n' || e.key === 'N') { judge('NONE'); }
        else if (e.key === 'u' || e.key === 'U') { judge('UNSURE'); }
        else if (e.key === 'ArrowLeft') { $('adj-prev').click(); }
        else if (e.key === 'ArrowRight') { $('adj-next').click(); }
      });

      loadState();
      render();
    })();
  </script>
