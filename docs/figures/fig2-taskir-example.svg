<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 606" width="800" height="606"
     font-family="Helvetica, Arial, sans-serif">
  <title>TaskIR by Example — cheapest flight before 8 PM</title>
  <desc>Natural-language task compiled to a three-node SSA TaskIR program, executed with per-node nominal costs and compared against a 70B single-shot baseline.</desc>

  <defs>
    <marker id="aDark"  viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
  </defs>

  <rect x="0" y="0" width="800" height="606" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="24" y="26" font-size="15" font-weight="bold" fill="#111827">TaskIR by Example — “Find the cheapest flight arriving before 8 PM”</text>
  <text x="24" y="42" font-size="9.5" fill="#6B7280">Natural-language task → flat SSA program → validated (V1–V6) → executed with per-node nominal costs</text>

  <!-- ================= LEFT PANEL ================= -->
  <!-- Input box -->
  <rect x="24" y="56" width="364" height="44" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="34" y="70" font-size="7.5" font-weight="bold" fill="#2563EB" letter-spacing="1">INPUT — NATURAL LANGUAGE TASK</text>
  <text x="34" y="88" font-size="11" font-style="italic" fill="#111827">“Find the cheapest flight arriving before 8 PM”</text>

  <line x1="206" y1="100" x2="206" y2="110" stroke="#374151" stroke-width="1.5" marker-end="url(#aDark)"/>

  <!-- Neural compiler chip (learned) -->
  <rect x="116" y="112" width="180" height="34" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
  <text x="206" y="124" text-anchor="middle" font-size="8" font-weight="bold" fill="#1E40AF">Neural Compiler — learned</text>
  <text x="206" y="137" text-anchor="middle" font-size="7.5" fill="#1E40AF">Qwen2.5-7B · LoRA</text>

  <line x1="206" y1="146" x2="206" y2="157" stroke="#374151" stroke-width="1.5" marker-end="url(#aDark)"/>

  <!-- compile boundary -->
  <line x1="24" y1="152" x2="388" y2="152" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="386" y="149" text-anchor="end" font-size="6.8" fill="#6B7280">compile boundary</text>

  <!-- TaskIR code box -->
  <rect x="24" y="160" width="364" height="202" rx="8" fill="#F8FAFC" stroke="#6B7280" stroke-width="1.3"/>
  <rect x="25.5" y="161.5" width="361" height="19" rx="5" fill="#E5E7EB"/>
  <text x="34" y="175" font-size="9" font-weight="bold" fill="#374151">TaskIR v0.1 — SSA TEXT FORM</text>
  <rect x="296" y="163" width="80" height="15" rx="7.5" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="336" y="174" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#065F46">✓ V1–V6 PASS</text>

  <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="10">
    <text x="34" y="198" fill="#374151">inputs:</text>
    <text x="34" y="212" fill="#374151">  @task : Str</text>

    <text x="34" y="240" fill="#B45309">%v1 = SEARCH(domain="flight",</text>
    <text x="220" y="240" fill="#9CA3AF">; List[Flight]</text>
    <text x="34" y="254" fill="#B45309">      query=@task)</text>

    <text x="34" y="282" fill="#0F766E">%v2 = FILTER(%v1, field="arrival",</text>
    <text x="244" y="282" fill="#9CA3AF">; List[Flight]</text>
    <text x="34" y="296" fill="#0F766E">      before="20:00")</text>

    <text x="34" y="324" fill="#0F766E">%v3 = ARGMIN(%v2, key="price")</text>
    <text x="226" y="324" fill="#9CA3AF">; Flight</text>

    <text x="34" y="352" fill="#374151" font-weight="bold">output: %v3</text>
  </g>

  <!-- executor-class chips -->
  <rect x="346" y="230" width="38" height="13" rx="6.5" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <text x="365" y="239.5" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#92400E">api</text>
  <rect x="338" y="272" width="46" height="13" rx="6.5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
  <text x="361" y="281.5" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#0F766E">python</text>
  <rect x="338" y="314" width="46" height="13" rx="6.5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
  <text x="361" y="323.5" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#0F766E">python</text>

  <!-- validation notes -->
  <text x="24" y="378" font-size="8" fill="#065F46">✓ V2 def-use · V3 DAG · V4 types · V5 ISA · V6 control — validated before execution</text>
  <text x="24" y="392" font-size="7.5" fill="#6B7280">tool names never enter the semantic layer:</text>
  <text x="24" y="403" font-size="7" fill="#6B7280" font-family="Consolas, Menlo, 'Courier New', monospace">google_flight_api.search → SEARCH(domain="flight")  [meta.provenance]</text>

  <!-- ================= RIGHT PANEL ================= -->
  <text x="416" y="66" font-size="9.5" font-weight="bold" fill="#374151" letter-spacing="0.5">PROGRAM DAG</text>

  <!-- node %v1 -->
  <rect x="416" y="80" width="104" height="42" rx="7" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
  <text x="468" y="97"  text-anchor="middle" font-size="9.5" font-weight="bold" fill="#92400E" font-family="Consolas, Menlo, monospace">%v1 SEARCH</text>
  <text x="468" y="111" text-anchor="middle" font-size="7.5" fill="#6B7280">: List[Flight]</text>
  <rect x="483" y="79" width="34" height="11" rx="5.5" fill="#FFFFFF" stroke="#D97706" stroke-width="0.8"/>
  <text x="500" y="87" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#92400E">api</text>

  <text x="532" y="75" text-anchor="middle" font-size="7" fill="#6B7280">List[Flight]</text>
  <line x1="520" y1="101" x2="542" y2="101" stroke="#374151" stroke-width="1.5" marker-end="url(#aDark)"/>

  <!-- node %v2 -->
  <rect x="544" y="80" width="104" height="42" rx="7" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.4"/>
  <text x="596" y="97"  text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0F766E" font-family="Consolas, Menlo, monospace">%v2 FILTER</text>
  <text x="596" y="111" text-anchor="middle" font-size="7.5" fill="#6B7280">: List[Flight]</text>
  <rect x="603" y="79" width="42" height="11" rx="5.5" fill="#FFFFFF" stroke="#0D9488" stroke-width="0.8"/>
  <text x="624" y="87" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#0F766E">python</text>

  <text x="660" y="75" text-anchor="middle" font-size="7" fill="#6B7280">List[Flight]</text>
  <line x1="648" y1="101" x2="670" y2="101" stroke="#374151" stroke-width="1.5" marker-end="url(#aDark)"/>

  <!-- node %v3 -->
  <rect x="672" y="80" width="104" height="42" rx="7" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.4"/>
  <text x="724" y="97"  text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0F766E" font-family="Consolas, Menlo, monospace">%v3 ARGMIN</text>
  <text x="724" y="111" text-anchor="middle" font-size="7.5" fill="#6B7280">: Flight</text>
  <rect x="731" y="79" width="42" height="11" rx="5.5" fill="#FFFFFF" stroke="#0D9488" stroke-width="0.8"/>
  <text x="752" y="87" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#0F766E">python</text>

  <line x1="724" y1="122" x2="724" y2="132" stroke="#059669" stroke-width="1.5" marker-end="url(#aGreen)"/>
  <text x="724" y="144" text-anchor="middle" font-size="8" font-weight="bold" fill="#059669">output %v3</text>
  <text x="560" y="152" text-anchor="middle" font-size="7.5" font-style="italic" fill="#6B7280">straight-line program — guard / SELECT omitted</text>

  <!-- Execution trace table -->
  <text x="416" y="172" font-size="9.5" font-weight="bold" fill="#374151" letter-spacing="0.5">EXECUTION TRACE — NOMINAL PER-NODE COSTS</text>

  <rect x="416" y="180" width="360" height="111" fill="none" stroke="#6B7280" stroke-width="1"/>
  <rect x="416" y="180" width="360" height="16" fill="#E5E7EB"/>
  <rect x="416" y="272" width="360" height="19" fill="#F3F4F6"/>
  <g stroke="#E5E7EB" stroke-width="1">
    <line x1="460" y1="180" x2="460" y2="291"/>
    <line x1="524" y1="180" x2="524" y2="291"/>
    <line x1="576" y1="180" x2="576" y2="291"/>
    <line x1="624" y1="180" x2="624" y2="291"/>
    <line x1="700" y1="180" x2="700" y2="291"/>
    <line x1="744" y1="180" x2="744" y2="291"/>
    <line x1="416" y1="196" x2="776" y2="196"/>
    <line x1="416" y1="215" x2="776" y2="215"/>
    <line x1="416" y1="234" x2="776" y2="234"/>
    <line x1="416" y1="253" x2="776" y2="253"/>
    <line x1="416" y1="272" x2="776" y2="272"/>
  </g>

  <g font-size="7.5" font-weight="bold" fill="#374151">
    <text x="422" y="191">node</text>
    <text x="466" y="191">op</text>
    <text x="530" y="191">exec</text>
    <text x="620" y="191" text-anchor="end">lat ms</text>
    <text x="696" y="191" text-anchor="end">tok in→out</text>
    <text x="740" y="191" text-anchor="end">FLOPs</text>
    <text x="760" y="191" text-anchor="middle">st</text>
  </g>

  <g font-size="8.5">
    <text x="422" y="208.5" font-weight="bold" fill="#1D4ED8" font-family="Consolas, Menlo, monospace">cmp</text>
    <text x="466" y="208.5" fill="#1D4ED8" font-style="italic">compile</text>
    <text x="530" y="208.5" fill="#1D4ED8">lm·7B</text>
    <text x="620" y="208.5" text-anchor="end" fill="#111827">480</text>
    <text x="696" y="208.5" text-anchor="end" fill="#111827">92→176</text>
    <text x="740" y="208.5" text-anchor="end" fill="#111827">3.8T</text>
    <text x="760" y="208.5" text-anchor="middle" fill="#059669" font-weight="bold">✓</text>

    <text x="422" y="227.5" font-weight="bold" fill="#B45309" font-family="Consolas, Menlo, monospace">%v1</text>
    <text x="466" y="227.5" fill="#374151">SEARCH</text>
    <text x="530" y="227.5" fill="#92400E">api</text>
    <text x="620" y="227.5" text-anchor="end" fill="#111827">120</text>
    <text x="696" y="227.5" text-anchor="end" fill="#9CA3AF">–</text>
    <text x="740" y="227.5" text-anchor="end" fill="#9CA3AF">–</text>
    <text x="760" y="227.5" text-anchor="middle" fill="#059669" font-weight="bold">✓</text>

    <text x="422" y="246.5" font-weight="bold" fill="#0F766E" font-family="Consolas, Menlo, monospace">%v2</text>
    <text x="466" y="246.5" fill="#374151">FILTER</text>
    <text x="530" y="246.5" fill="#0F766E">python</text>
    <text x="620" y="246.5" text-anchor="end" fill="#111827">3</text>
    <text x="696" y="246.5" text-anchor="end" fill="#9CA3AF">–</text>
    <text x="740" y="246.5" text-anchor="end" fill="#9CA3AF">–</text>
    <text x="760" y="246.5" text-anchor="middle" fill="#059669" font-weight="bold">✓</text>

    <text x="422" y="265.5" font-weight="bold" fill="#0F766E" font-family="Consolas, Menlo, monospace">%v3</text>
    <text x="466" y="265.5" fill="#374151">ARGMIN</text>
    <text x="530" y="265.5" fill="#0F766E">python</text>
    <text x="620" y="265.5" text-anchor="end" fill="#111827">2</text>
    <text x="696" y="265.5" text-anchor="end" fill="#9CA3AF">–</text>
    <text x="740" y="265.5" text-anchor="end" fill="#9CA3AF">–</text>
    <text x="760" y="265.5" text-anchor="middle" fill="#059669" font-weight="bold">✓</text>

    <text x="422" y="284.5" font-weight="bold" fill="#111827" font-family="Consolas, Menlo, monospace">Σ</text>
    <text x="466" y="284.5" font-weight="bold" fill="#111827">pipeline</text>
    <text x="620" y="284.5" text-anchor="end" font-weight="bold" fill="#111827">605</text>
    <text x="696" y="284.5" text-anchor="end" font-weight="bold" fill="#111827">268</text>
    <text x="740" y="284.5" text-anchor="end" font-weight="bold" fill="#111827">3.8T</text>
    <text x="760" y="284.5" text-anchor="middle" fill="#059669" font-weight="bold">✓</text>
  </g>

  <text x="416" y="305" font-size="7.5" fill="#6B7280">tokens &amp; FLOPs accrue only on lm-class nodes (compile step listed for completeness;</text>
  <text x="416" y="316" font-size="7.5" fill="#6B7280">runtime ops run on api / python executors)</text>

  <!-- ================= COST SUMMARY BARS ================= -->
  <text x="24" y="428" font-size="11" font-weight="bold" fill="#111827">COST SUMMARY — COMPILED PIPELINE VS 70B SINGLE-SHOT BASELINE (NOMINAL)</text>

  <!-- G1: latency -->
  <text x="24" y="446" font-size="8.5" font-weight="bold" fill="#374151">end-to-end latency</text>
  <text x="24" y="457" font-size="7" fill="#6B7280">compile + execute, ms</text>
  <rect x="190" y="440" width="550" height="12" fill="#6B7280"/>
  <text x="198" y="449.5" font-size="8" fill="#FFFFFF">70B single-shot — 2,500 ms</text>
  <rect x="190" y="456" width="106" height="12" fill="#2563EB"/>
  <rect x="296" y="456" width="28"  height="12" fill="#93C5FD"/>
  <text x="332" y="465.5" font-size="8" font-weight="bold" fill="#111827">compiled pipeline — 605 ms (24.2%)</text>

  <!-- G2: energy -->
  <text x="24" y="494" font-size="8.5" font-weight="bold" fill="#374151">energy</text>
  <text x="24" y="505" font-size="7" fill="#6B7280">joules, nominal</text>
  <rect x="190" y="488" width="550" height="12" fill="#6B7280"/>
  <text x="198" y="497.5" font-size="8" fill="#FFFFFF">≈900 J</text>
  <rect x="190" y="504" width="3.5" height="12" fill="#2563EB"/>
  <text x="202" y="513.5" font-size="8" font-weight="bold" fill="#111827">≈5.5 J (0.6%)</text>

  <!-- G3: tokens -->
  <text x="24" y="542" font-size="8.5" font-weight="bold" fill="#374151">tokens per task</text>
  <text x="24" y="553" font-size="7" fill="#6B7280">in + out</text>
  <rect x="190" y="536" width="550" height="12" fill="#6B7280"/>
  <text x="198" y="545.5" font-size="8" fill="#FFFFFF">1,800</text>
  <rect x="190" y="552" width="82" height="12" fill="#2563EB"/>
  <text x="282" y="561.5" font-size="8" font-weight="bold" fill="#111827">268 (14.9%)</text>

  <!-- legend -->
  <rect x="24"  y="574" width="10" height="10" fill="#2563EB"/><text x="40"  y="582.5" font-size="7.5" fill="#374151">compile step (lm)</text>
  <rect x="150" y="574" width="10" height="10" fill="#93C5FD"/><text x="166" y="582.5" font-size="7.5" fill="#374151">execute (api / python)</text>
  <rect x="300" y="574" width="10" height="10" fill="#6B7280"/><text x="316" y="582.5" font-size="7.5" fill="#374151">70B baseline (single-shot)</text>

  <text x="24" y="598" font-size="7" fill="#9CA3AF">Nominal constants from the Skill ISA registry; benchmark-suite means vs baseline: 3.4% energy, 37.9% makespan. Profiling hooks replace constants.</text>
</svg>
